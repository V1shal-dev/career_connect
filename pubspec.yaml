name: career_connect
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core (NO STORAGE)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management
  provider: ^6.1.2

  # UI/UX Enhancements
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # File Handling (Cloudinary Alternative)
  file_picker: ^8.1.2
  http: ^1.2.2
  dio: ^5.7.0
  url_launcher: ^6.3.1  # Added line

  # Utilities
  intl: ^0.19.0
  google_fonts: ^6.3.2

  # Navigation
  go_router: ^14.2.7

  # Animations
  lottie: ^3.1.2
  animations: ^2.0.11

  # Icons
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
